# ============================================================
# Cabbage Crop Detection System - Configuration
# ============================================================

# ---------------------------------------------------------------
# SATELLITE DATA BACKEND
# Choose one: "gee" | "planetary_computer" | "sentinel_hub"
#
# "gee"                 — Google Earth Engine (free for research)
#                         Requires: GEE account + project ID
#                         Sign up free: https://earthengine.google.com
#
# "planetary_computer"  — Microsoft Planetary Computer (completely free)
#                         No account or project ID needed at all.
#                         Just install: pip install pystac-client stackstac
#                         This is the best option if you don't have GEE.
#
# "sentinel_hub"        — Sentinel Hub on AWS (free trial, then paid)
#                         Requires: sentinel_hub account + client_id/secret
# ---------------------------------------------------------------
data_backend: "gee"

gee:
  project_id: "crop-detection-494609"
  service_account: ""

planetary_computer:
  subscription_key: ""

sentinel_hub:
  # Free trial at: https://www.sentinel-hub.com
  client_id: ""
  client_secret: ""
  instance_id: ""

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  models_dir: "models/saved"
  output_dir: "outputs"
  kml_dir: "data/kml"

sentinel2:
  bands: ["B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A", "B11", "B12"]
  cloud_threshold: 20
  scale: 10

sentinel1:
  bands: ["VV", "VH"]
  orbit_pass: "DESCENDING"
  scale: 10

compositing:
  months_before: 3               # ±3 months (6 months total) — captures full cycle + cloud buffer
  months_after: 3
  composite_frequency: "monthly"   # Monthly composites (generates ~7 observations total)
  # Why ±3 months for pan-India:
  #   Cabbage completes its lifecycle in 60-120 days, but in monsoon-heavy
  #   regions (NE India, hills) 2-3 months of optical data may be cloud-free.
  #   ±3 months ensures at least 4-5 usable composites even in cloudy zones.
  #   SAR (Sentinel-1) fills gaps in cloud-affected months.
  #   This window works for ALL Indian seasons: Rabi, Kharif, and year-round hills.

sampling:
  buffer_m: 250                  # Buffer for fragmented cabbage fields (0.1-1 ha typical)
  max_pixels_per_plot: 500
  negative_ratio: 1.0
  random_seed: 42
  minimum_field_area_ha: 0.10    # 10 Sentinel pixels minimum (cabbage fields are small)

features:
  spectral_indices: ["NDVI", "EVI", "NDWI", "RVI", "LSWI", "NDRE", "CCCI"]
  temporal_stats:
    - "min"
    - "max"
    - "mean"
    - "median"
    - "p10"
    - "p25"
    - "p75"
    - "p90"
    - "std"
    - "range"
    - "cv"
  phenology:
    ndvi_threshold: 0.3
    smooth_window: 3
    function_set: "heading_vegetable"   # BBCH-scale features for heading vegetables (cabbage)
    key_indices: ["NDVI", "NDRE", "EVI", "LSWI", "CCCI"]

models:
  random_forest:
    n_estimators: [100, 200, 300, 500]
    max_depth: [10, 20, 30, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
    n_iter: 30
    cv_folds: 5

  xgboost:
    learning_rate: [0.01, 0.05, 0.1, 0.2]
    max_depth: [3, 5, 7, 9]
    n_estimators: [200, 500, 1000]
    subsample: [0.6, 0.8, 1.0]
    colsample_bytree: [0.6, 0.8, 1.0]
    early_stopping_rounds: 50
    eval_metric: "aucpr"

  ensemble:
    meta_model: "logistic"
    cv_folds: 5

inference:
  output_format: "geotiff"
  probability_threshold: 0.200   # Calibrated after training (Youden/F1 optimal)
  min_patch_size_m2: 100
  months_before: 3               # ±3 months for inference (handles cloud gaps across India)
  months_after: 3
  max_kml_size_mb: 10

# === Cabbage Seasonal Calendar (India) ===
# Used to validate anchor dates and adjust temporal windows
seasonal_calendar:
  northern_plains:    # UP, Bihar, Punjab, Haryana
    transplant_start: "September"
    transplant_end: "October"
    harvest_start: "December"
    harvest_end: "February"
  eastern:            # West Bengal, Odisha, Assam
    transplant_start: "October"
    transplant_end: "December"
    harvest_start: "January"
    harvest_end: "March"
  western_central:    # Gujarat, MP, Maharashtra
    transplant_start: "November"
    transplant_end: "December"
    harvest_start: "February"
    harvest_end: "March"
  southern:           # Karnataka, Tamil Nadu
    transplant_start: "June"
    transplant_end: "November"
    harvest_start: "September"
    harvest_end: "April"
  hills:              # Himachal, Uttarakhand, NE states
    transplant_start: "April"
    transplant_end: "September"
    harvest_start: "July"
    harvest_end: "November"
